[project]
name = "brain-agents"
version = "0.1.0"
description = "LangGraph brain agents (reader + writer) with Gemini"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.1.4",
    "mcp[cli]>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "sentence-transformers>=5.4.1",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.12.0",
]

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain_agents"]

[project.scripts]
brain-mcp = "brain_agents.mcp_server:main"

[tool.uv]
package = true
